<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — Accounting</title>
<style>
:root{
  --ink:#17213A; --ink-2:#233054; --paper:#FBFAF6; --paper-2:#F1EFE8; --line:#DDD9CE;
  --text:#1E2430; --muted:#6B7280; --green:#1F6F5A; --green-soft:#E3F1EC; --red:#A83A3A; --red-soft:#F7E6E6;
  --amber:#B7791F; --amber-soft:#FBF0DA; --blue:#2F5FA8; --focus:#2F5FA8;
  --radius:6px; --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:14px;color:var(--text);background:var(--paper);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* Sidebar */
.side{background:var(--ink);color:#DCE1EE;display:flex;flex-direction:column;overflow:auto}
.brand{padding:18px 18px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{font-size:20px;letter-spacing:-.02em;color:#fff;font-weight:700}
.brand span{font-size:11px;color:#9AA5C4}
.company-box{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.company-box select{width:100%;background:var(--ink-2);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:7px 8px}
.company-box small{display:block;color:#9AA5C4;margin-top:6px;font-size:11px}
.nav{padding:8px 0 20px;flex:1}
.nav h6{margin:14px 18px 4px;font-size:11px;font-weight:600;color:#8D97B5;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 18px;color:#DCE1EE;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.1);border-left-color:#7FD1B9;color:#fff}
.nav a .k{width:16px;text-align:center;color:#8D97B5;font-size:12px}
.side .user{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9AA5C4}
.side .user b{color:#fff;display:block;font-size:13px}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:#fff}
.topbar h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.topbar .sp{flex:1}
.topbar .period{font-size:12px;color:var(--muted)}
.content{padding:20px 24px 60px;overflow:auto;flex:1}
/* Controls */
.btn{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-size:13px;line-height:1.2}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#185a49}
.btn.danger{color:var(--red);border-color:#e3c2c2}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;background:#fff;width:100%}
input[type=number]{text-align:right}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.toolbar input,.toolbar select{width:auto}
/* Cards & tables */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #EDEAE1;vertical-align:top}
tr:hover td{background:#FAF8F2}
.num,th.num{text-align:right;white-space:nowrap}
td.dr{color:var(--text)} td.cr{color:var(--text)}
.total td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none;background:transparent}
.sub td{font-weight:600;background:#F6F4EE}
.indent1{padding-left:24px}.indent2{padding-left:40px}
.neg{color:var(--red)}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.tag.draft{background:#EEE;color:#555}.tag.posted{background:var(--green-soft);color:var(--green)}.tag.paid{background:#E2ECF9;color:var(--blue)}
.tag.partial{background:var(--amber-soft);color:var(--amber)}.tag.overdue{background:var(--red-soft);color:var(--red)}.tag.void{background:#EEE;color:#888;text-decoration:line-through}
.tag.reversed{background:#EEE;color:#888}
.clickable{cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.notice{padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.notice.warn{background:var(--amber-soft);color:#7a5210}.notice.err{background:var(--red-soft);color:var(--red)}.notice.ok{background:var(--green-soft);color:var(--green)}
/* Journal lines - the ledger sheet */
.ledger{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:repeating-linear-gradient(#fff 0 35px,#F7F5EE 35px 36px)}
.ledger table{background:transparent}
.ledger th{background:var(--paper-2)}
.ledger td{border-bottom:none;padding:3px 6px}
.ledger tr:hover td{background:transparent}
.ledger input,.ledger select{padding:5px 7px;border-color:transparent;background:transparent}
.ledger input:hover,.ledger select:hover{border-color:var(--line);background:#fff}
.ledger input:focus,.ledger select:focus{border-color:var(--blue);background:#fff}
.ledger td div>select{min-width:130px}
.ledger .col-dr{border-left:2px solid #C9D8EE}.ledger .col-cr{border-left:2px solid #E8C9C9}
.balance-line{display:flex;justify-content:flex-end;gap:24px;padding:10px 12px;font-weight:600;background:var(--paper-2);border-top:1px solid var(--line)}
.balance-line .ok{color:var(--green)}.balance-line .bad{color:var(--red)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(23,33,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:8px;width:100%;max-width:720px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:1040px}
.modal h2{margin:0 0 14px;font-size:17px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:none;padding:8px 10px;white-space:nowrap;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--green);font-weight:600}
/* Toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;font-size:13px}
#toast.show{opacity:1}
.report-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.report-head h2{margin:0;font-size:16px}
.report-head .meta{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b{display:flex;gap:2px;align-items:flex-end;height:110px;width:100%;justify-content:center}
.bars .b i{display:block;width:40%;background:var(--green);border-radius:2px 2px 0 0}
.bars .b i.e{background:#C9A4A4}
.bars .lbl{font-size:11px;color:var(--muted)}
.login{height:100vh;display:grid;place-items:center;background:var(--ink)}
.login .box{background:#fff;padding:28px;border-radius:8px;width:360px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
@media print{.side,.topbar,.toolbar,.btn,.no-print{display:none!important}#app{display:block}.content{padding:0;overflow:visible}body{background:#fff}}
@media (max-width:900px){#app{grid-template-columns:1fr}.side{display:none}.g2,.g3,.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
/* ===================== CORE: helpers, state, storage ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const monthKey = d => d.slice(0, 7);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(n, blankZero=false) {
  n = r2(n); if (blankZero && n === 0) return '';
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return n < 0 ? `(${s})` : s;
}
function fmtDate(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd} ${MONTHS[+m - 1]} ${y}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function download(name, text, type='text/plain') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }
function toCSV(rows) { return rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'); }

const ACCOUNT_TYPES = ['Asset', 'Liability', 'Equity', 'Income', 'Expense'];
const SUBTYPES = {
  Asset: ['Cash & Bank', 'Accounts Receivable', 'Inventory', 'Other Current Asset', 'Fixed Asset', 'Accumulated Depreciation', 'Other Asset'],
  Liability: ['Accounts Payable', 'Tax Payable', 'Other Current Liability', 'Long-term Liability'],
  Equity: ['Capital', 'Retained Earnings', 'Drawings', 'Other Equity'],
  Income: ['Sales Revenue', 'Other Income'],
  Expense: ['Cost of Sales', 'Operating Expense', 'Depreciation', 'Finance Cost', 'Tax Expense', 'Other Expense'],
};
const DEBIT_NORMAL = { Asset: true, Expense: true, Liability: false, Equity: false, Income: false };
const ROLES = { admin: 'Administrator', accountant: 'Accountant', viewer: 'Viewer' };
const CAN = { post: ['admin','accountant'], edit: ['admin','accountant'], settings: ['admin'], lock: ['admin'] };

/* Generic chart of accounts template — works for any trading / service company */
const COA_TEMPLATE = [
  // code, name, type, subtype, control (system role)
  ['1000','Cash on Hand','Asset','Cash & Bank','cash'],
  ['1010','Main Bank Account','Asset','Cash & Bank','bank'],
  ['1020','Petty Cash','Asset','Cash & Bank',''],
  ['1100','Accounts Receivable','Asset','Accounts Receivable','ar'],
  ['1150','Advances to Suppliers','Asset','Other Current Asset',''],
  ['1200','Inventory','Asset','Inventory','inventory'],
  ['1300','Prepaid Expenses','Asset','Other Current Asset',''],
  ['1350','Input Tax Receivable','Asset','Other Current Asset','taxin'],
  ['1500','Property, Plant & Equipment','Asset','Fixed Asset','fa'],
  ['1510','Vehicles','Asset','Fixed Asset',''],
  ['1520','Computers & Office Equipment','Asset','Fixed Asset',''],
  ['1590','Accumulated Depreciation','Asset','Accumulated Depreciation','accdep'],
  ['2000','Accounts Payable','Liability','Accounts Payable','ap'],
  ['2100','Output Tax Payable','Liability','Tax Payable','taxout'],
  ['2130','Advances from Customers','Liability','Other Current Liability',''],
  ['2200','Accrued Expenses','Liability','Other Current Liability',''],
  ['2210','Salaries Payable','Liability','Other Current Liability',''],
  ['2500','Bank Loan','Liability','Long-term Liability',''],
  ['3000','Share Capital','Equity','Capital',''],
  ['3100','Retained Earnings','Equity','Retained Earnings','re'],
  ['3200','Owner Drawings','Equity','Drawings',''],
  ['4000','Sales Revenue','Income','Sales Revenue','sales'],
  ['4100','Service Revenue','Income','Sales Revenue',''],
  ['4900','Other Income','Income','Other Income',''],
  ['4910','Discount Received','Income','Other Income',''],
  ['5000','Cost of Goods Sold','Expense','Cost of Sales','cogs'],
  ['5100','Purchases','Expense','Cost of Sales','purchases'],
  ['6000','Salaries & Wages','Expense','Operating Expense',''],
  ['6100','Rent','Expense','Operating Expense',''],
  ['6200','Utilities','Expense','Operating Expense',''],
  ['6300','Marketing & Advertising','Expense','Operating Expense',''],
  ['6400','Office Supplies','Expense','Operating Expense',''],
  ['6500','Travel & Transport','Expense','Operating Expense',''],
  ['6600','Professional Fees','Expense','Operating Expense',''],
  ['6700','Insurance','Expense','Operating Expense',''],
  ['6800','Repairs & Maintenance','Expense','Operating Expense',''],
  ['6900','Bank Charges','Expense','Finance Cost','bankfee'],
  ['6950','Interest Expense','Expense','Finance Cost',''],
  ['7000','Depreciation Expense','Expense','Depreciation','depexp'],
  ['7100','Discount Allowed','Expense','Other Expense',''],
  ['7200','Bad Debts','Expense','Other Expense',''],
  ['7900','Foreign Exchange Gain / Loss','Expense','Other Expense',''],
];

function newCompany(name, currency='USD', fyStartMonth=1, opts={}) {
  const c = {
    id: uid(), name, currency, fyStartMonth, lockDate: '', taxLabel: opts.taxLabel || 'VAT',
    address: opts.address || '', taxId: opts.taxId || '', numbering: { INV: 1, BILL: 1, RCT: 1, PAY: 1, JE: 1, CN: 1, DN: 1 },
    accounts: COA_TEMPLATE.map(([code, name, type, subtype, ctl]) => ({ id: uid(), code, name, type, subtype, ctl, active: true })),
    taxRates: [{ id: uid(), name: 'Standard', rate: opts.taxRate ?? 5 }, { id: uid(), name: 'Zero-rated', rate: 0 }, { id: uid(), name: 'Exempt', rate: 0, exempt: true }],
    parties: [], items: [], journals: [], docs: [], payments: [], assets: [], bankLines: [], audit: [],
  };
  return c;
}

let S = { companies: [], activeId: null, users: [], currentUser: null, view: 'dashboard', param: null };
const KEY = 'daftar.v1';
function save() { try { localStorage.setItem(KEY, JSON.stringify({ companies: S.companies, activeId: S.activeId, users: S.users })); } catch (e) { console.warn(e); } }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.companies?.length) { S.companies = d.companies; S.activeId = d.activeId; S.users = d.users || []; return true; } } catch (e) {}
  return false;
}
const C = () => S.companies.find(c => c.id === S.activeId);
const acc = id => C().accounts.find(a => a.id === id);
const accByCode = code => C().accounts.find(a => a.code === code);
const ctl = role => C().accounts.find(a => a.ctl === role);
const party = id => C().parties.find(p => p.id === id);
const can = perm => S.currentUser && CAN[perm].includes(S.currentUser.role);
function audit(action, detail) { C().audit.unshift({ at: new Date().toISOString(), by: S.currentUser?.name || 'system', action, detail }); if (C().audit.length > 500) C().audit.length = 500; }
function nextNo(prefix) { const n = C().numbering[prefix]++; return `${prefix}-${String(n).padStart(5, '0')}`; }
function fyStart(date) { const c = C(); const y = +date.slice(0, 4), m = +date.slice(5, 7); const fy = m >= c.fyStartMonth ? y : y - 1; return `${fy}-${String(c.fyStartMonth).padStart(2, '0')}-01`; }
function fyEnd(date) { const s = fyStart(date); const y = +s.slice(0, 4) + 1; const d = new Date(`${y}-${s.slice(5, 7)}-01`); d.setDate(0); return d.toISOString().slice(0, 10); }

/* ===================== ACCOUNTING ENGINE ===================== */
function validateJournal(j) {
  const errs = [];
  if (!j.date) errs.push('Date is required.');
  if (C().lockDate && j.date <= C().lockDate) errs.push(`Period is locked up to ${fmtDate(C().lockDate)}.`);
  const lines = j.lines.filter(l => l.accountId && (r2(l.debit) || r2(l.credit)));
  if (lines.length < 2) errs.push('A journal needs at least two lines with amounts.');
  lines.forEach((l, i) => {
    if (r2(l.debit) && r2(l.credit)) errs.push(`Line ${i + 1}: enter either a debit or a credit, not both.`);
    if (r2(l.debit) < 0 || r2(l.credit) < 0) errs.push(`Line ${i + 1}: amounts cannot be negative.`);
    const a = acc(l.accountId); if (a && !a.active) errs.push(`Line ${i + 1}: ${a.name} is inactive.`);
    if (a && ['ar', 'ap'].includes(a.ctl) && !l.partyId) errs.push(`Line ${i + 1}: ${a.name} requires a customer/supplier.`);
  });
  const dr = r2(lines.reduce((s, l) => s + r2(l.debit), 0)), cr = r2(lines.reduce((s, l) => s + r2(l.credit), 0));
  if (r2(dr - cr) !== 0) errs.push(`Journal is out of balance by ${fmt(Math.abs(dr - cr))}.`);
  return { errs, lines, dr, cr };
}
function postJournal(j) {
  const v = validateJournal(j); if (v.errs.length) throw new Error(v.errs.join(' '));
  const entry = { id: j.id || uid(), no: j.no || nextNo('JE'), date: j.date, memo: j.memo || '', source: j.source || 'manual', sourceId: j.sourceId || null,
    lines: v.lines.map(l => ({ accountId: l.accountId, partyId: l.partyId || null, memo: l.memo || '', debit: r2(l.debit), credit: r2(l.credit), ...(l.fx ? { fx: l.fx } : {}), ...(l.projectId ? { projectId: l.projectId } : {}) })),
    status: 'posted', createdAt: new Date().toISOString(), by: S.currentUser?.name };
  C().journals.push(entry); audit('Post journal', `${entry.no} ${entry.memo} (${fmt(v.dr)})`); return entry;
}
function reverseJournal(id, date) {
  const j = C().journals.find(x => x.id === id); if (!j || j.status !== 'posted') throw new Error('Only posted journals can be reversed.');
  if (j.reversedBy) throw new Error('Already reversed.');
  const rev = postJournal({ date: date || today(), memo: `Reversal of ${j.no}: ${j.memo}`, source: 'reversal', sourceId: j.id,
    lines: j.lines.map(l => ({ ...l, debit: l.credit, credit: l.debit, fx: l.fx ? { cur: l.fx.cur, amt: -l.fx.amt } : undefined })) });
  j.reversedBy = rev.id; j.status = 'reversed'; return rev;
}
// signed balance: positive = normal-side balance
function balances(from, to, opts={}) {
  const map = {};
  for (const j of C().journals) {
    if (j.status === 'void') continue; if (opts.excludeClose && j.source === 'close') continue;
    if (from && j.date < from) continue; if (to && j.date > to) continue;
    for (const l of j.lines) {
      if (opts.partyId && l.partyId !== opts.partyId) continue;
      const b = map[l.accountId] ||= { dr: 0, cr: 0 }; b.dr += l.debit; b.cr += l.credit;
    }
  }
  return map;
}
function net(b, a) { if (!b) return 0; return r2(DEBIT_NORMAL[a.type] ? b.dr - b.cr : b.cr - b.dr); }
function ledgerLines(accountId, from, to, partyId) {
  const out = [];
  for (const j of C().journals) if (j.status !== 'void') for (const l of j.lines) if (l.accountId === accountId && (!partyId || l.partyId === partyId)) out.push({ ...l, jid: j.id, no: j.no, date: j.date, jmemo: j.memo, source: j.source, sourceId: j.sourceId });
  out.sort((a, b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  const a = acc(accountId); let run = 0; const res = []; let opening = 0;
  for (const l of out) {
    const d = DEBIT_NORMAL[a.type] ? l.debit - l.credit : l.credit - l.debit;
    if (from && l.date < from) { opening += d; continue; } if (to && l.date > to) continue;
    run += d; res.push({ ...l, run: r2(run + opening) });
  }
  return { opening: r2(opening), lines: res, closing: r2(opening + run) };
}
function plTotals(from, to) {
  const b = balances(from, to, { excludeClose: true }); let income = 0, expense = 0, cogs = 0;
  for (const a of C().accounts) { const n = net(b[a.id], a); if (a.type === 'Income') income += n; else if (a.type === 'Expense') { expense += n; if (a.subtype === 'Cost of Sales') cogs += n; } }
  return { income: r2(income), expense: r2(expense), cogs: r2(cogs), profit: r2(income - expense) };
}
// Retained earnings incl. unclosed profit of prior years, at a date
function retainedEarningsAt(date) {
  const start = fyStart(date); const b = balances(null, addDays(start, -1)); let p = 0;

  const m = $('#modal .modal'); if (m) m.innerHTML = html; else openModal(html, true);

function autoBalanceJE() { const v = validateJournal(JE); const diff = r2(v.dr - v.cr); const last = JE.lines[JE.lines.length - 1]; if (diff > 0) { last.credit = r2((last.credit || 0) + diff); last.debit = 0; } else { last.debit = r2((last.debit || 0) - diff); last.credit = 0; } renderJE(); }

  <div class="card"><h3>Book entries — tick the ones that appear on the statement</h3><table><tr><th></th><th>Date</th><th>Journal</th><th>Description</th><th class="num">In</th><th class="num">Out</th></tr>${L.lines.map(l => `<tr><td><input type="checkbox" ${cleared.has(l.jid) ? 'checked' : ''} onchange="toggleClear('${l.jid}','${l.date}','${esc(l.jmemo).replace(/'/g, '')}',${r2(l.debit - l.credit)},this.checked)"></td><td>${fmtDate(l.date)}</td><td class="mono">${l.no}</td><td>${esc(l.jmemo)}</td><td class="num">${fmt(l.debit, true)}</td><td class="num">${fmt(l.credit, true)}</td></tr>`).join('')}</table></div>
  ${c.bankLines.filter(x => !x.matchJid).length ? `<div class="card"><h3>Imported statement lines not yet matched</h3><table><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th></th></tr>${c.bankLines.filter(x => !x.matchJid).map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.desc)}</td><td class="num">${fmt(x.amount)}</td><td class="num"><button class="btn sm" onclick="matchLine('${x.id}','${aid}')">Find match</button></td></tr>`).join('')}</table></div>` : ''}`;
} };
function toggleClear(jid, date, desc, amount, on) { const c = C(); let bl = c.bankLines.find(x => x.matchJid === jid); if (on) { if (!bl) { bl = c.bankLines.find(x => !x.matchJid && x.amount === amount && Math.abs((new Date(x.date) - new Date(date)) / 864e5) <= 5) || { id: uid(), date, desc, amount }; if (!c.bankLines.includes(bl)) c.bankLines.push(bl); bl.matchJid = jid; } bl.cleared = true; } else if (bl) { bl.cleared = false; if (bl.imported) bl.matchJid = null; else c.bankLines.splice(c.bankLines.indexOf(bl), 1); } save(); render(); }
function matchLine(id, aid) { const bl = C().bankLines.find(x => x.id === id); const L = ledgerLines(aid, null, today()); const cand = L.lines.filter(l => r2(l.debit - l.credit) === bl.amount && !C().bankLines.some(x => x.matchJid === l.jid)); if (!cand.length) return toast('No book entry with the same amount. Record it first.'); const l = cand[0]; bl.matchJid = l.jid; bl.cleared = true; commit(`Matched to ${l.no}`); }
function importStatement() { openModal(`<h2>Paste statement lines</h2><p class="muted">One line per row: <span class="mono">date, description, amount</span> (negative for money out). Example:<br><span class="mono">${today()}, Card settlement, 1250.00</span></p><textarea id="st_txt" style="min-height:160px"></textarea><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="tryDo(()=>{let n=0;fval('st_txt').split('\\n').forEach(r=>{const p=r.split(',');if(p.length<3)return;const amt=+p.pop();C().bankLines.push({id:uid(),date:p[0].trim(),desc:p.slice(1).join(',').trim(),amount:r2(amt),cleared:false,imported:true});n++});if(!n)throw new Error('No valid lines found.')},'Statement lines imported')">Import</button></div>`); }

  ${id ? '' : '<div class="field"><label><input type="checkbox" id="fa_post" checked> Post the purchase journal now (Dr asset / Cr Accounts Payable or bank)</label> ' + sel('fa_pay', [...bankOpts(), [ctl('ap').id, 'Accounts Payable (on credit)']], ctl('bank').id) + '</div>'}

function saveAsset(id) { tryDo(() => { const d = { code: fval('fa_code'), name: fval('fa_name'), category: fval('fa_cat'), purchaseDate: fval('fa_date'), cost: +fval('fa_cost'), salvage: +fval('fa_salv'), accumulated: +fval('fa_acc'), method: fval('fa_method'), lifeMonths: +fval('fa_life') || 1, rate: +fval('fa_rate'), assetAccountId: fval('fa_a1'), accDepAccountId: fval('fa_a2'), expenseAccountId: fval('fa_a3') };

  const outAcc = ctl('taxout'), inAcc = ctl('taxin'); const b = balances(from, to); const out = net(b[outAcc.id], outAcc), inp = net(b[inAcc.id], inAcc);

function settleTax(amount) { openModal(`<h2>Record ${C().taxLabel} settlement</h2><p class="muted">Clears output and input tax for the period against the bank.</p><div class="row"><div class="field"><label class="f">Date</label><input type="date" id="ts_date" value="${today()}"></div><div class="field"><label class="f">Output tax</label><input type="number" step="0.01" id="ts_out" value="${r2(net(balances(null, today())[ctl('taxout').id], ctl('taxout')))}"></div><div class="field"><label class="f">Input tax</label><input type="number" step="0.01" id="ts_in" value="${r2(net(balances(null, today())[ctl('taxin').id], ctl('taxin')))}"></div><div class="field"><label class="f">Bank</label>${sel('ts_bank', bankOpts(), ctl('bank').id)}</div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="tryDo(()=>{const o=+fval('ts_out'),i=+fval('ts_in'),n=r2(o-i);const lines=[];if(o)lines.push({accountId:ctl('taxout').id,debit:o,credit:0});if(i)lines.push({accountId:ctl('taxin').id,debit:0,credit:i});lines.push(n>=0?{accountId:fval('ts_bank'),debit:0,credit:n}:{accountId:fval('ts_bank'),debit:-n,credit:0});postJournal({date:fval('ts_date'),memo:C().taxLabel+' settlement',source:'tax',lines})},'Settlement posted')">Post</button></div>`); }

VIEWS.periods = { title: () => 'Periods & year end', body: c => {
  const years = [...new Set(c.journals.map(j => fyStart(j.date)))].sort(); const closed = c.journals.filter(j => j.source === 'close');
  return `<div class="grid g2"><div class="card"><h3>Period lock</h3><p class="muted">Nothing can be posted on or before the lock date. Use it after month-end review or filing.</p><div class="row"><div class="field"><label class="f">Lock date</label><input type="date" id="lk" value="${c.lockDate}"></div><div class="field" style="flex:0"><button class="btn primary" onclick="if(guard('lock'))tryDo(()=>{C().lockDate=fval('lk');audit('Period lock',fval('lk')||'cleared')},'Lock updated')">Apply</button></div></div></div>
  <div class="card"><h3>Year-end close</h3><p class="muted">Transfers the year's income and expenses to Retained Earnings and locks the year. Reports still show the year's P&L (closing entries are excluded from P&L reports).</p>${years.map(y => { const e = fyEnd(y); const done = closed.find(j => j.date === e); return `<div class="row" style="margin-bottom:8px"><div>FY ${fmtDate(y)} – ${fmtDate(e)}</div><div style="flex:0">${done ? `<span class="tag paid">closed · ${done.no}</span>` : e <= today() && can('lock') ? `<button class="btn sm" onclick="if(confirm('Close the year ending ${e}? This posts a closing journal and locks the period.'))tryDo(()=>yearEndClose('${e}'),'Year closed')">Close year</button>` : '<span class="tag draft">open</span>'}</div></div>`; }).join('')}</div></div>
  <div class="card"><h3>Integrity check</h3>${integrityCheck()}</div>`;

function integrityCheck() { const c = C(); const b = balances(); let dr = 0, cr = 0; for (const v of Object.values(b)) { dr += v.dr; cr += v.cr; } const unbalanced = c.journals.filter(j => r2(j.lines.reduce((s, l) => s + l.debit - l.credit, 0)) !== 0);
  const ar = ctl('ar'), ap = ctl('ap'); const arBal = net(b[ar.id], ar), apBal = net(b[ap.id], ap); const ob = d => toBase(docOutstanding(d), d.rate || 1); const arDocs = r2(c.docs.filter(d => d.type === 'INV' && d.status === 'posted').reduce((s, d) => s + ob(d), 0) - c.docs.filter(d => d.type === 'CN' && d.status === 'posted').reduce((s, d) => s + ob(d), 0)), apDocs = r2(c.docs.filter(d => d.type === 'BILL' && d.status === 'posted').reduce((s, d) => s + ob(d), 0) - c.docs.filter(d => d.type === 'DN' && d.status === 'posted').reduce((s, d) => s + ob(d), 0));
  const row = (ok, t) => `<div class="notice ${ok ? 'ok' : 'err'}">${ok ? '✓' : '✗'} ${t}</div>`;
  return row(r2(dr - cr) === 0, `All journals balance: total debits ${fmt(dr)} = credits ${fmt(cr)}`) + row(!unbalanced.length, `${unbalanced.length} unbalanced journal(s)`) + row(Math.abs(arBal - arDocs) < 0.01, `Receivable control ${fmt(arBal)} vs open invoices ${fmt(arDocs)}${Math.abs(arBal - arDocs) >= 0.01 ? ' — difference is unapplied receipts, exchange adjustments or manual AR journals' : ''}`) + row(Math.abs(apBal - apDocs) < 0.01, `Payable control ${fmt(apBal)} vs open bills ${fmt(apDocs)}${Math.abs(apBal - apDocs) >= 0.01 ? ' — difference is unapplied payments, exchange adjustments or manual AP journals' : ''}`); }

VIEWS.reports = { title: () => 'Financial reports', body: c => {
  const p = S.param || {}; const r = p.r || 0; const from = p.from || fyStart(today()), to = p.to || today();
  const head = `<div class="tabs no-print">${REPORTS.map((n, i) => `<button class="${r === i ? 'on' : ''}" onclick="S.param={...S.param,r:${i}};render()">${n}</button>`).join('')}</div>

  const rh = (title, sub) => `<div class="report-head"><div><h2>${title}</h2><div class="meta">${esc(c.name)} · ${sub}</div></div><div class="meta">Amounts in ${c.currency}</div></div>`;

    const b = balances(null, to, { excludeClose: false }); const rows = []; let td = 0, tc = 0;

  if (!c.accounts.find(a => a.ctl === 'fxgain')) c.accounts.push({ id: uid(), code: '4920', name: 'Exchange Gain', type: 'Income', subtype: 'Other Income', ctl: 'fxgain', active: true });

const ctlIn = (c, role) => c.accounts.find(a => a.ctl === role);
const baseCur = () => C().currency;
const curRate = code => code === baseCur() ? 1 : (C().currencies.find(x => x.code === code)?.rate || 1);
const toBase = (amt, rate) => r2(amt * rate);

/* Inventory */
function stockMove(item, qty, unitCost, date, ref, memo) { // qty +in / -out ; returns cost value moved (base)
  if (qty > 0) { const newQty = item.stockQty + qty; item.avgCost = newQty ? r2((item.stockQty * item.avgCost + qty * unitCost) / newQty) : unitCost; item.stockQty = r2(newQty); C().stockMoves.push({ id: uid(), itemId: item.id, date, qty, cost: unitCost, value: r2(qty * unitCost), ref, memo }); return r2(qty * unitCost); }
  const cost = item.avgCost; item.stockQty = r2(item.stockQty + qty); C().stockMoves.push({ id: uid(), itemId: item.id, date, qty, cost, value: r2(qty * cost), ref, memo }); return r2(-qty * cost);
}
function itemByName(n) { return C().items.find(i => i.name === n || i.code === n); }

}

/* Documents v2: currency-aware, item-aware, non-posting types */
function calcDoc(d) {
  d.currency ||= baseCur(); d.rate ??= curRate(d.currency); let sub = 0, tax = 0;

    const amt = r2((+l.qty || 0) * (+l.price || 0) * (1 - (+l.disc || 0) / 100)); l.amount = amt; const tr = C().taxRates.find(t => t.id === l.taxId); l.tax = tr && !tr.exempt ? r2(amt * tr.rate / 100) : 0; sub += amt; tax += l.tax; });

}
function docTypeName(t) { return DOC_TYPES[t] || t; }
function docStatus(d) {

}

  const ctrl = isSale ? ctl('ar') : ctl('ap'); const taxAcc = isSale ? ctl('taxout') : ctl('taxin'); const pn = party(d.partyId)?.name;
  const lines = [];
  const push = (accountId, dr, cr, memo, partyId, fxAmt) => { dr = r2(dr * sign); cr = r2(cr * sign); if (dr < 0) { cr = -dr; dr = 0; } else if (cr < 0) { dr = -cr; cr = 0; } const l = { accountId, debit: dr, credit: cr, memo, partyId, projectId: d.projectId || null }; if (fxc && fxAmt != null) l.fx = { cur: fxc, amt: r2(fxAmt * sign) }; lines.push(l); };
  const bt = toBase(d.total, rate);
  if (isSale) push(ctrl.id, bt, 0, `${d.no} ${pn}`, d.partyId, d.total); else push(ctrl.id, 0, bt, `${d.no} ${pn}`, d.partyId, -d.total);
  const byAcc = {}; let stockValue = 0;
  d.lines.forEach(l => { if (!l.amount) return; const it = l.itemId && C().items.find(x => x.id === l.itemId); let accId = l.accountId;
    if (it?.trackStock) { if (!isSale) { accId = it.inventoryAccountId; if (!isCredit) stockMove(it, +l.qty, toBase(l.amount / l.qty, rate), d.date, d.no, `${docTypeName(d.type)} ${pn}`); else stockMove(it, -l.qty, 0, d.date, d.no, `${docTypeName(d.type)} ${pn}`); }
      else { const v = isCredit ? stockMove(it, +l.qty, it.avgCost, d.date, d.no, `Return ${pn}`) : stockMove(it, -l.qty, 0, d.date, d.no, `Sale ${pn}`); stockValue += v; } }
    byAcc[accId] = (byAcc[accId] || 0) + toBase(l.amount, rate); });

/* Payments v2: currency-aware with realised exchange gain/loss */
function postPayment(p) {

/* Expenses (Zoho-style: standalone expense record, optional vendor, billable to customer/project) */
function postExpense(e) {

  const tr = C().taxRates.find(t => t.id === e.taxId); const tax = tr && !tr.exempt ? (e.taxInclusive ? r2(amt - amt / (1 + tr.rate / 100)) : r2(amt * tr.rate / 100)) : 0; const netAmt = e.taxInclusive ? r2(amt - tax) : amt; const gross = r2(netAmt + tax);
  const lines = [{ accountId: e.accountId, debit: netAmt, credit: 0, memo: e.notes, projectId: e.projectId || null }]; if (tax) lines.push({ accountId: ctl('taxin').id, debit: tax, credit: 0, memo: C().taxLabel });
  if (e.paidThrough === 'AP') { if (!e.vendorId) throw new Error('Select the vendor to record it as payable.'); lines.push({ accountId: ctl('ap').id, debit: 0, credit: gross, partyId: e.vendorId, memo: e.ref }); } else lines.push({ accountId: e.paidThrough, debit: 0, credit: gross, memo: e.ref });

  const rec = { id: uid(), no, date: e.date, accountId: e.accountId, amount: gross, net: netAmt, tax, vendorId: e.vendorId || '', customerId: e.customerId || '', projectId: e.projectId || '', billable: !!e.billable, markup: +e.markup || 0, invoiced: false, notes: e.notes || '', ref: e.ref || '', paidThrough: e.paidThrough, journalId: j.id, status: 'posted' }; j.sourceId = rec.id; C().expenses.push(rec);

}

/* Recurring profiles */
function advance(date, freq) { const d = new Date(date); if (freq === 'weekly') d.setDate(d.getDate() + 7); else if (freq === 'monthly') d.setMonth(d.getMonth() + 1); else if (freq === 'quarterly') d.setMonth(d.getMonth() + 3); else d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0, 10); }
function runRecurring(upTo) {

  for (const r of C().recurring) { if (r.status !== 'active') continue;
    while (r.nextDate && r.nextDate <= upTo && (!r.endDate || r.nextDate <= r.endDate)) {
      if (r.kind === 'JE') { const j = { date: r.nextDate, memo: r.template.memo, source: 'recurring', lines: r.template.lines.map(l => ({ ...l })) }; postJournal(j); }
      else if (r.kind === 'EXP') postExpense({ ...r.template, date: r.nextDate });
      else { const d = JSON.parse(JSON.stringify(r.template)); d.id = uid(); d.no = nextNo(r.kind); d.date = r.nextDate; d.dueDate = addDays(r.nextDate, party(d.partyId)?.terms || 30); d.status = 'draft'; d.paid = 0; d.journalId = null; d.recurringId = r.id; d.lines.forEach(l => l.id = uid()); C().docs.push(d); if (r.autoPost) postDoc(d); }

function recurringDue() { return C().recurring.filter(r => r.status === 'active' && r.nextDate <= today()).length; }

/* Currency revaluation (unrealised gain/loss) */
function fxExposure(asAt) { // returns rows: {kind:'bank'|'party', id, cur, fxBal, baseBal}
  const rows = {}; for (const j of C().journals) { if (j.status === 'void' || j.date > asAt) continue; for (const l of j.lines) { if (!l.fx) continue; const a = acc(l.accountId); const key = ['ar', 'ap'].includes(a.ctl) ? `${a.id}|${l.partyId}` : a.id; const r = rows[key] ||= { accountId: a.id, partyId: ['ar', 'ap'].includes(a.ctl) ? l.partyId : null, cur: l.fx.cur, fxBal: 0, baseBal: 0 }; r.fxBal = r2(r.fxBal + l.fx.amt); r.baseBal = r2(r.baseBal + l.debit - l.credit); } }

}

function paymentEditor(kind, partyId, docId) {
  if (!guard('post')) return; const p = party(partyId); PM = { kind, date: today(), partyId: partyId || '', bankAccountId: ctl('bank').id, amount: 0, discount: 0, ref: '', alloc: {}, currency: p?.currency || baseCur(), rate: curRate(p?.currency || baseCur()) };
  if (docId) { const d = C().docs.find(x => x.id === docId); PM.alloc[docId] = docOutstanding(d); PM.amount = docOutstanding(d); PM.currency = d.currency; PM.rate = d.rate; }
  renderPM();
}
function renderPM() {
  const isRct = PM.kind === 'RCT'; const kind = isRct ? 'customer' : 'supplier'; const types = isRct ? ['INV', 'CN'] : ['BILL', 'DN']; const fx = PM.currency !== baseCur();
  const open = C().docs.filter(d => d.partyId === PM.partyId && types.includes(d.type) && d.status === 'posted' && docOutstanding(d) > 0 && d.currency === PM.currency).sort((a, b) => a.date.localeCompare(b.date));
  const allocTotal = r2(Object.values(PM.alloc).reduce((s, v) => s + (+v || 0), 0)); const diff = r2(PM.amount + r2(PM.discount) - allocTotal);
  let gain = 0; if (fx) for (const [id, v] of Object.entries(PM.alloc)) { const d = C().docs.find(x => x.id === id); if (d && +v) gain += r2(toBase(+v, PM.rate) - toBase(+v, d.rate)); } if (!isRct) gain = -gain;
  const html = `<h2>New ${isRct ? 'payment received' : 'payment made'}</h2>
  <div class="row"><div class="field" style="flex:2"><label class="f">${kind === 'customer' ? 'Customer' : 'Vendor'}</label>${sel('pm_party', [['', '— select —'], ...partyOpts(kind)], PM.partyId, `onchange="PM.partyId=this.value;PM.alloc={};const p=party(this.value);PM.currency=p?.currency||baseCur();PM.rate=curRate(PM.currency);renderPM()"`)}</div><div class="field"><label class="f">Date</label><input type="date" value="${PM.date}" onchange="PM.date=this.value"></div><div class="field" style="flex:2"><label class="f">${isRct ? 'Deposit to' : 'Pay from'}</label>${sel('pm_bank', bankOpts().map(o => { const a = acc(o[0]); return [o[0], o[1] + (a.currency && a.currency !== baseCur() ? ` (${a.currency})` : '')]; }), PM.bankAccountId, `onchange="PM.bankAccountId=this.value"`)}</div></div>
  <div class="row"><div class="field"><label class="f">Amount (${PM.currency})</label><input type="number" step="0.01" value="${PM.amount || ''}" onchange="PM.amount=+this.value;renderPM()"></div>${fx ? `<div class="field"><label class="f">Rate to ${baseCur()}</label><input type="number" step="0.000001" value="${PM.rate}" onchange="PM.rate=+this.value;renderPM()"></div>` : ''}<div class="field"><label class="f">Settlement discount</label><input type="number" step="0.01" value="${PM.discount || ''}" onchange="PM.discount=+this.value;renderPM()"></div><div class="field" style="flex:2"><label class="f">Reference (cheque / transfer no.)</label><input type="text" value="${esc(PM.ref)}" oninput="PM.ref=this.value"></div></div>
  <h3>Apply to open documents${fx ? ` in ${PM.currency}` : ''}</h3>${open.length ? `<table><tr><th>Document</th><th>Date</th><th>Due</th><th class="num">Balance</th><th class="num" style="width:150px">Apply</th></tr>${open.map(d => { const cn = isCreditDoc(d); return `<tr><td class="mono">${d.no}${cn ? ' <span class="tag draft">' + d.type + '</span>' : ''}</td><td>${fmtDate(d.date)}</td><td>${cn ? '' : fmtDate(d.dueDate)}</td><td class="num">${fmt(cn ? -docOutstanding(d) : docOutstanding(d))}</td><td><input type="number" step="0.01" value="${PM.alloc[d.id] ?? ''}" onchange="PM.alloc['${d.id}']=+this.value;renderPM()"></td></tr>`; }).join('')}</table><div style="margin-top:6px"><button class="btn sm" onclick="autoAlloc()">Auto-apply oldest first</button></div>` : '<div class="empty">No open documents for this party in this currency. The amount will be held on account.</div>'}
  <div class="balance-line" style="margin-top:10px"><span>Applied ${fmt(allocTotal)}</span>${fx ? `<span>${baseCur()} ${fmt(toBase(PM.amount, PM.rate))}${gain ? ` · exchange ${gain > 0 ? 'gain' : 'loss'} ${fmt(Math.abs(gain))}` : ''}</span>` : ''}<span class="${diff === 0 ? 'ok' : diff > 0 ? '' : 'bad'}">${diff === 0 ? 'Fully applied' : diff > 0 ? 'On account ' + fmt(diff) : 'Over-applied by ' + fmt(-diff)}</span></div>
  <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="tryDo(()=>postPayment({...PM,allocations:Object.entries(PM.alloc).filter(([k,v])=>+v).map(([docId,amount])=>({docId,amount:+amount}))}),'Posted')">Save payment</button></div>`;
  const m = $('#modal .modal'); if (m) m.innerHTML = html; else openModal(html, true);
}
function autoAlloc() { const isRct = PM.kind === 'RCT'; const types = isRct ? ['INV', 'CN'] : ['BILL', 'DN']; let left = r2(PM.amount + r2(PM.discount)); PM.alloc = {};
  const open = C().docs.filter(d => d.partyId === PM.partyId && types.includes(d.type) && d.status === 'posted' && docOutstanding(d) > 0 && d.currency === PM.currency).sort((a, b) => a.date.localeCompare(b.date));
  for (const d of open.filter(isCreditDoc)) { PM.alloc[d.id] = -docOutstanding(d); left = r2(left + docOutstanding(d)); }
  for (const d of open.filter(d => !isCreditDoc(d))) { if (left <= 0) break; const a = Math.min(left, docOutstanding(d)); PM.alloc[d.id] = a; left = r2(left - a); } renderPM(); }

function categorise(id) { if (!guard('post')) return; const b = C().bankLines.find(x => x.id === id); const isIn = b.amount > 0; const cand = candidateMatches(b, b.accountId); const rule = C().bankRules.find(r => b.desc.toLowerCase().includes(r.contains.toLowerCase()));

function applyCategorise(id) { const b = C().bankLines.find(x => x.id === id); const k = fval('ct_kind'); const amt = Math.abs(b.amount); const isIn = b.amount > 0; const memo = b.desc;

function projectStats(p) { const c = C(); const te = c.timeEntries.filter(t => t.projectId === p.id); const hours = te.reduce((s, t) => s + t.hours, 0), billable = te.filter(t => t.billable).reduce((s, t) => s + t.hours, 0), unbilled = te.filter(t => t.billable && !t.invoiced).reduce((s, t) => s + t.hours, 0);
